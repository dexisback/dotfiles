# === Minimal Kitty Image Neofetch Config ===
print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info cols
}

# === Image settings ===
image_backend="chafa"
# Set to custom image or fallback
image_source="${HOME}/Downloads/mummy_and_amaan.jpeg"
image_size="250px"
print_image="on"
image_position="left"
ascii="off"
ascii_distro="Arch"
crop_mode="normal"
image_offset="0"
gap=2
